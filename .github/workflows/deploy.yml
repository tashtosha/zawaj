name: Deploy to Surge
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Surge
        run: npm install -g surge

      - name: Deploy to Surge
        run:     surge .   8d8gdg8d7gdg8gd8g7d.Surge.sh --token ${{ secrets.SURGE_TOKEN }}
